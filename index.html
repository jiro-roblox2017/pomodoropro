<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timer (v4)</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F8F9FA;
      color: #212529;
      font-family: sans-serif;
    }

    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 28px;
      box-sizing: border-box;
    }

    /* 上部：時刻 / 目標 / 連続記録の枠組み */
    .hud-top {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
      gap: 16px;
    }

    /* ① 左上：時刻・天気 */
    .clock-box {
      line-height: 1.3;
      font-weight: bold;
    }

    .clock-time {
      font-size: 32px;
    }

    .clock-sub {
      font-size: 18px;
      margin-top: 4px;
    }

    /* ② 中央：目標カード枠 */
    .goal-card {
      width: 240px;
      border: 2px solid #212529;
      border-radius: 10px;
      background: #fff;
      padding: 10px 12px;
      box-sizing: border-box;
    }

    .goal-title {
      font-size: 15px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .goal-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .goal-item {
      border: 1px solid #212529;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      background: #F8F9FA;
    }

    /* ③ 右上：Duolingo風 連続記録枠 */
    .streak-card {
      justify-self: end;
      border: 3px solid #FF9600;
      border-radius: 16px;
      background: #fff;
      padding: 12px 16px;
      box-shadow: 0 0 0 3px rgba(255, 150, 0, 0.22);
    }

    .streak-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
      font-weight: bold;
    }

    .streak-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .streak-icon {
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .streak-circle {
      width: 14px;
      height: 14px;
      border: 2px solid #212529;
      border-radius: 50%;
      display: inline-block;
    }

    .divider {
      width: 320px;
      height: 2px;
      background: #212529;
      margin: 12px auto 0;
    }

    /* 下部：タイマー本体 */
    .timer-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .mode-switch, .preset-switch {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .mode-btn, .preset-btn {
      font-size: 15px;
      font-weight: bold;
      padding: 8px 20px;
      border-radius: 999px;
      border: 2px solid #DEE2E6;
      background: #fff;
      color: #212529;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .mode-btn.active {
      border-color: #0095D9;
      background: #0095D9;
      color: #fff;
    }

    .preset-btn.demo {
      border-color: #0095D9;
      background: #fff;
      color: #0095D9;
    }

    .preset-btn.normal {
      border-color: #0095D9;
      background: #0095D9;
      color: #fff;
    }

    .preset-btn.active {
      box-shadow: 0 0 0 2px rgba(0, 149, 217, 0.25);
    }

    .setting-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      align-items: center;
      font-size: 16px;
      font-weight: bold;
    }

    input[type="number"] {
      width: 68px;
      font-size: 18px;
      padding: 8px 10px;
      border: 2px solid #CED4DA;
      border-radius: 12px;
      background: #fff;
      color: #212529;
      text-align: center;
    }

    .round-btn {
      font-size: 20px;
      font-weight: bold;
      padding: 12px 32px;
      border-radius: 999px;
      border: 2px solid #212529;
      background: #fff;
      color: #212529;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.15s ease;
    }

    .round-btn:hover {
      opacity: 0.88;
    }

    .round-btn:active {
      transform: scale(0.97);
    }

    .round-btn.small {
      font-size: 16px;
      padding: 9px 22px;
    }

    .round-btn.primary {
      background: #0095D9;
      color: #fff;
      border-color: #0095D9;
    }

    .status-label {
      font-size: 16px;
      font-weight: bold;
      color: #0095D9;
    }

    #time {
      font-size: 84px;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
      line-height: 1.05;
    }

    .btns {
      display: flex;
      gap: 16px;
    }

    /* 作動中はフルスクリーン＆タイマーと停止ボタンのみ */
    body.running .hud-top,
    body.running .divider,
    body.running .top,
    body.running .status-label,
    body.running #resetBtn {
      display: none;
    }

    body.running #time {
      font-size: 132px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hud-top">
      <!-- ① 時刻・天気枠 -->
      <div class="clock-box">
        <div class="clock-time" id="clockTime">12：34<span style="font-size:20px;margin-left:6px;">北区</span></div>
        <div class="clock-sub" id="weatherSub">北区の天気を取得中...</div>
      </div>

      <!-- ② 目標枠 -->
      <div class="goal-card">
        <div class="goal-title">
          <span>平日の目標</span>
          <span>×</span>
        </div>
        <div class="goal-list">
          <div class="goal-item">数学やる</div>
          <div class="goal-item">英語やる</div>
          <div class="goal-item">漢字やる</div>
        </div>
      </div>

      <!-- ③ Duolingo風 連続記録枠 -->
      <div class="streak-card">
        <div class="streak-days" id="streakDays"></div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="timer-area">
      <div class="top">
        <div class="mode-switch">
          <button id="focusTab" class="mode-btn active">集中</button>
          <button id="breakTab" class="mode-btn">休憩</button>
          <button id="soundBtn" class="mode-btn active">音: 中</button>
        </div>

        <div class="preset-switch">
          <button id="demoPresetBtn" class="preset-btn demo active">デモ：集中5秒 / 休憩2秒</button>
          <button id="normalPresetBtn" class="preset-btn normal">通常：集中25分 / 休憩5分</button>
        </div>

        <div class="setting-row">
          <span>集中</span>
          <input id="focusInput" type="number" min="1" max="180" value="5" />
          <span id="focusUnit">秒</span>
          <span>／ 休憩</span>
          <input id="breakInput" type="number" min="1" max="180" value="2" />
          <span id="breakUnit">秒</span>
          <button id="setBtn" class="round-btn small">セット</button>
        </div>
      </div>

      <div id="statusLabel" class="status-label">集中モード</div>
      <div id="time">00:05</div>

      <div class="btns">
        <button id="startBtn" class="round-btn primary">開始</button>
        <button id="stopBtn" class="round-btn primary" style="display:none;">停止</button>
        <button id="resetBtn" class="round-btn">リセット</button>
      </div>
    </div>
  </div>

  <script>
    const VOLUME_LEVELS = [
      { label: "音: オフ", gain: 0 },
      { label: "音: 小", gain: 0.04 },
      { label: "音: 中", gain: 0.14 },
      { label: "音: 大", gain: 0.32 }
    ];

    const DAYS = ["月", "火", "水", "木", "金", "土", "日"];
    let flames = [true, true, true, true, true, true, false];

    let unitMode = "sec";
    let focusSec = 5;
    let breakSec = 2;
    let mode = "focus";
    let sec = focusSec;
    let running = false;
    let volumeIndex = 2;
    let audioCtx = null;

    const timeEl = document.getElementById("time");
    const statusLabel = document.getElementById("statusLabel");
    const focusInput = document.getElementById("focusInput");
    const breakInput = document.getElementById("breakInput");
    const focusUnit = document.getElementById("focusUnit");
    const breakUnit = document.getElementById("breakUnit");
    const focusTab = document.getElementById("focusTab");
    const breakTab = document.getElementById("breakTab");
    const soundBtn = document.getElementById("soundBtn");
    const demoPresetBtn = document.getElementById("demoPresetBtn");
    const normalPresetBtn = document.getElementById("normalPresetBtn");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const resetBtn = document.getElementById("resetBtn");
    const setBtn = document.getElementById("setBtn");
    const clockTimeEl = document.getElementById("clockTime");
    const weatherSubEl = document.getElementById("weatherSub");
    const streakDaysEl = document.getElementById("streakDays");

    function updateClock() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      clockTimeEl.innerHTML = `${hh}：${mm}<span style="font-size:20px;margin-left:6px;">北区</span>`;
    }

    async function fetchKitaWeather() {
      const url =
        "https://api.open-meteo.com/v1/forecast?latitude=35.7528&longitude=139.7337&current=temperature_2m,weather_code&timezone=Asia%2FTokyo";
      try {
        const res = await fetch(url);
        const data = await res.json();
        const temp = Math.round(data.current.temperature_2m);
        const code = data.current.weather_code;

        let weatherText = "晴れ";
        if (code === 0 || code === 1) weatherText = "晴れ";
        else if (code === 2 || code === 3) weatherText = "くもり";
        else if (code >= 45 && code <= 48) weatherText = "霧";
        else if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) weatherText = "雨";
        else if (code >= 71 && code <= 77) weatherText = "雪";
        else if (code >= 95) weatherText = "雷雨";

        weatherSubEl.textContent = `北区${weatherText}${temp}度`;
      } catch (e) {
        weatherSubEl.textContent = "北区の天気取得失敗";
      }
    }

    function renderStreak() {
      streakDaysEl.innerHTML = "";
      DAYS.forEach((d, idx) => {
        const col = document.createElement("div");
        col.className = "streak-col";
        const icon = document.createElement("div");
        icon.className = "streak-icon";
        icon.innerHTML = flames[idx] ? "🔥" : '<span class="streak-circle"></span>';
        const label = document.createElement("div");
        label.textContent = d;
        col.onclick = () => {
          flames[idx] = !flames[idx];
          renderStreak();
        };
        col.append(icon, label);
        streakDaysEl.appendChild(col);
      });
    }

    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
    }

    function playSound(type = "preview") {
      const vol = VOLUME_LEVELS[volumeIndex].gain;
      if (vol <= 0) return;
      initAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const notes =
        type === "focusEnd"
          ? [659.25, 523.25]
          : type === "breakEnd"
          ? [523.25, 659.25, 783.99]
          : [587.33];

      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, now + idx * 0.14);
        gain.gain.setValueAtTime(vol, now + idx * 0.14);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.14 + 0.24);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.14);
        osc.stop(now + idx * 0.14 + 0.25);
      });
    }

    function render() {
      const m = String(Math.floor(sec / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      timeEl.textContent = `${m}:${s}`;
      statusLabel.textContent = mode === "focus" ? "集中モード" : "休憩モード";

      const isMin = unitMode === "min";
      focusUnit.textContent = isMin ? "分" : "秒";
      breakUnit.textContent = isMin ? "分" : "秒";
      focusInput.value = isMin ? Math.max(1, Math.round(focusSec / 60)) : focusSec;
      breakInput.value = isMin ? Math.max(1, Math.round(breakSec / 60)) : breakSec;

      demoPresetBtn.classList.toggle("active", !isMin);
      normalPresetBtn.classList.toggle("active", isMin);

      const currentVol = VOLUME_LEVELS[volumeIndex];
      soundBtn.textContent = currentVol.label;
      soundBtn.classList.toggle("active", volumeIndex > 0);

      document.body.classList.toggle("running", running);
      focusTab.classList.toggle("active", mode === "focus");
      breakTab.classList.toggle("active", mode === "break");
      startBtn.style.display = running ? "none" : "inline-block";
      stopBtn.style.display = running ? "inline-block" : "none";
    }

    function applyCycle(newFocusSec, newBreakSec, nextUnitMode = unitMode) {
      running = false;
      unitMode = nextUnitMode;
      focusSec = Math.max(1, Number(newFocusSec) || 1);
      breakSec = Math.max(1, Number(newBreakSec) || 1);
      mode = "focus";
      sec = focusSec;
      if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
      render();
    }

    function switchMode(newMode) {
      running = false;
      mode = newMode;
      sec = mode === "focus" ? focusSec : breakSec;
      render();
    }

    soundBtn.onclick = () => {
      volumeIndex = (volumeIndex + 1) % VOLUME_LEVELS.length;
      render();
      playSound("preview");
    };

    focusTab.onclick = () => switchMode("focus");
    breakTab.onclick = () => switchMode("break");

    demoPresetBtn.onclick = () => applyCycle(5, 2, "sec");
    normalPresetBtn.onclick = () => applyCycle(25 * 60, 5 * 60, "min");

    setBtn.onclick = () => {
      const multiplier = unitMode === "min" ? 60 : 1;
      const fVal = Math.max(1, Number(focusInput.value) || 1) * multiplier;
      const bVal = Math.max(1, Number(breakInput.value) || 1) * multiplier;
      applyCycle(fVal, bVal, unitMode);
    };

    startBtn.onclick = () => {
      initAudio();
      running = true;
      document.documentElement.requestFullscreen?.().catch(() => {});
      render();
    };

    stopBtn.onclick = () => {
      running = false;
      if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
      render();
    };

    resetBtn.onclick = () => {
      running = false;
      sec = mode === "focus" ? focusSec : breakSec;
      if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
      render();
    };

    setInterval(() => {
      if (!running) return;
      if (sec > 1) {
        sec--;
        render();
      } else {
        if (mode === "focus") {
          playSound("focusEnd");
          mode = "break";
          sec = breakSec;
        } else {
          playSound("breakEnd");
          mode = "focus";
          sec = focusSec;
        }
        render();
      }
    }, 1000);

    updateClock();
    setInterval(updateClock, 10000);
    fetchKitaWeather();
    setInterval(fetchKitaWeather, 600000);
    renderStreak();
    render();
  </script>
</body>
</html>
