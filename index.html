<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F8F9FA;
      color: #212529;
      font-family: sans-serif;
    }

    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .mode-switch {
      display: flex;
      gap: 10px;
    }

    .mode-btn {
      font-size: 16px;
      font-weight: bold;
      padding: 8px 22px;
      border-radius: 999px;
      border: 2px solid #DEE2E6;
      background: #fff;
      color: #212529;
      cursor: pointer;
    }

    .mode-btn.active {
      border-color: #0095D9;
      background: #0095D9;
      color: #fff;
    }

    .setting-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      align-items: center;
      font-size: 16px;
      font-weight: bold;
    }

    input[type="number"] {
      width: 68px;
      font-size: 18px;
      padding: 8px 10px;
      border: 2px solid #CED4DA;
      border-radius: 12px;
      background: #fff;
      color: #212529;
      text-align: center;
    }

    .round-btn {
      font-size: 20px;
      font-weight: bold;
      padding: 12px 32px;
      border-radius: 999px;
      border: 2px solid #212529;
      background: #fff;
      color: #212529;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.15s ease;
    }

    .round-btn:hover {
      opacity: 0.88;
    }

    .round-btn:active {
      transform: scale(0.97);
    }

    .round-btn.small {
      font-size: 16px;
      padding: 9px 22px;
    }

    .round-btn.primary {
      background: #0095D9;
      color: #fff;
      border-color: #0095D9;
    }

    #time {
      font-size: 84px;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
      line-height: 1.05;
    }

    .btns {
      display: flex;
      gap: 16px;
    }

    /* 作動中はタイマーと停止ボタンのみ表示 */
    body.running .top,
    body.running #resetBtn {
      display: none;
    }

    body.running #time {
      font-size: 132px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="mode-switch">
        <button id="focusTab" class="mode-btn active">集中</button>
        <button id="breakTab" class="mode-btn">休憩</button>
      </div>

      <div class="setting-row">
        <span>集中</span>
        <input id="focusInput" type="number" min="1" max="180" value="25" />
        <span>分</span>
        <span>／ 休憩</span>
        <input id="breakInput" type="number" min="1" max="60" value="5" />
        <span>分</span>
        <button id="setBtn" class="round-btn small">セット</button>
      </div>
    </div>

    <div id="time">25:00</div>

    <div class="btns">
      <button id="startBtn" class="round-btn primary">開始</button>
      <button id="stopBtn" class="round-btn primary" style="display:none;">停止</button>
      <button id="resetBtn" class="round-btn">リセット</button>
    </div>
  </div>

  <script>
    let focusMin = 25;
    let breakMin = 5;
    let mode = "focus"; // "focus" | "break"
    let sec = focusMin * 60;
    let running = false;

    const timeEl = document.getElementById("time");
    const focusInput = document.getElementById("focusInput");
    const breakInput = document.getElementById("breakInput");
    const focusTab = document.getElementById("focusTab");
    const breakTab = document.getElementById("breakTab");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const resetBtn = document.getElementById("resetBtn");
    const setBtn = document.getElementById("setBtn");

    function render() {
      const m = String(Math.floor(sec / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      timeEl.textContent = `${m}:${s}`;
      document.body.classList.toggle("running", running);
      focusTab.classList.toggle("active", mode === "focus");
      breakTab.classList.toggle("active", mode === "break");
      startBtn.style.display = running ? "none" : "inline-block";
      stopBtn.style.display = running ? "inline-block" : "none";
    }

    function switchMode(newMode) {
      running = false;
      mode = newMode;
      sec = (mode === "focus" ? focusMin : breakMin) * 60;
      render();
    }

    focusTab.onclick = () => switchMode("focus");
    breakTab.onclick = () => switchMode("break");

    setBtn.onclick = () => {
      running = false;
      focusMin = Math.max(1, Number(focusInput.value) || 25);
      breakMin = Math.max(1, Number(breakInput.value) || 5);
      sec = (mode === "focus" ? focusMin : breakMin) * 60;
      render();
    };

    startBtn.onclick = () => {
      running = true;
      document.documentElement.requestFullscreen?.().catch(() => {});
      render();
    };

    stopBtn.onclick = () => {
      running = false;
      if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
      render();
    };

    resetBtn.onclick = () => {
      running = false;
      sec = (mode === "focus" ? focusMin : breakMin) * 60;
      if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
      render();
    };

    setInterval(() => {
      if (!running) return;
      if (sec > 0) {
        sec--;
        render();
      } else {
        running = false;
        if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
        if (mode === "focus") {
          mode = "break";
          sec = breakMin * 60;
          render();
          alert("集中終了！休憩に切り替わりました。");
        } else {
          mode = "focus";
          sec = focusMin * 60;
          render();
          alert("休憩終了！集中に切り替わりました。");
        }
      }
    }, 1000);

    render();
  </script>
</body>
</html>
