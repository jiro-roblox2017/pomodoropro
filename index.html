<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timer (Demo + Sound)</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F8F9FA;
      color: #212529;
      font-family: sans-serif;
    }

    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .mode-switch, .preset-switch {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .mode-btn, .preset-btn {
      font-size: 15px;
      font-weight: bold;
      padding: 8px 20px;
      border-radius: 999px;
      border: 2px solid #DEE2E6;
      background: #fff;
      color: #212529;
      cursor: pointer;
    }

    .mode-btn.active {
      border-color: #0095D9;
      background: #0095D9;
      color: #fff;
    }

    .preset-btn.demo {
      border-color: #0095D9;
      color: #0095D9;
    }

    .setting-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      align-items: center;
      font-size: 16px;
      font-weight: bold;
    }

    input[type="number"] {
      width: 68px;
      font-size: 18px;
      padding: 8px 10px;
      border: 2px solid #CED4DA;
      border-radius: 12px;
      background: #fff;
      color: #212529;
      text-align: center;
    }

    .round-btn {
      font-size: 20px;
      font-weight: bold;
      padding: 12px 32px;
      border-radius: 999px;
      border: 2px solid #212529;
      background: #fff;
      color: #212529;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.15s ease;
    }

    .round-btn:hover {
      opacity: 0.88;
    }

    .round-btn:active {
      transform: scale(0.97);
    }

    .round-btn.small {
      font-size: 16px;
      padding: 9px 22px;
    }

    .round-btn.primary {
      background: #0095D9;
      color: #fff;
      border-color: #0095D9;
    }

    .status-label {
      font-size: 16px;
      font-weight: bold;
      color: #0095D9;
      letter-spacing: 0.06em;
    }

    #time {
      font-size: 84px;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
      line-height: 1.05;
    }

    .btns {
      display: flex;
      gap: 16px;
    }

    body.running .top,
    body.running .status-label,
    body.running #resetBtn {
      display: none;
    }

    body.running #time {
      font-size: 132px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="mode-switch">
        <button id="focusTab" class="mode-btn active">集中</button>
        <button id="breakTab" class="mode-btn">休憩</button>
        <button id="soundBtn" class="mode-btn">音: ON</button>
      </div>

      <div class="preset-switch">
        <button id="demoPresetBtn" class="preset-btn demo">デモ：集中5秒 / 休憩2秒</button>
        <button id="normalPresetBtn" class="preset-btn">通常：集中25分 / 休憩5分</button>
      </div>

      <div class="setting-row">
        <span>集中</span>
        <input id="focusInput" type="number" min="1" max="180" value="5" />
        <span>秒</span>
        <span>／ 休憩</span>
        <input id="breakInput" type="number" min="1" max="180" value="2" />
        <span>秒</span>
        <button id="setBtn" class="round-btn small">セット</button>
      </div>
    </div>

    <div id="statusLabel" class="status-label">集中モード</div>
    <div id="time">00:05</div>

    <div class="btns">
      <button id="startBtn" class="round-btn primary">開始</button>
      <button id="stopBtn" class="round-btn primary" style="display:none;">停止</button>
      <button id="resetBtn" class="round-btn">リセット</button>
    </div>
  </div>

  <script>
    // デモ用に初期値を 集中5秒 / 休憩2秒 に設定
    let focusSec = 5;
    let breakSec = 2;
    let mode = "focus"; // "focus" | "break"
    let sec = focusSec;
    let running = false;
    let soundOn = true;
    let audioCtx = null;

    const timeEl = document.getElementById("time");
    const statusLabel = document.getElementById("statusLabel");
    const focusInput = document.getElementById("focusInput");
    const breakInput = document.getElementById("breakInput");
    const focusTab = document.getElementById("focusTab");
    const breakTab = document.getElementById("breakTab");
    const soundBtn = document.getElementById("soundBtn");
    const demoPresetBtn = document.getElementById("demoPresetBtn");
    const normalPresetBtn = document.getElementById("normalPresetBtn");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const resetBtn = document.getElementById("resetBtn");
    const setBtn = document.getElementById("setBtn");

    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
    }

    function playSound(type = "focusEnd") {
      if (!soundOn) return;
      initAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const notes = type === "focusEnd" ? [659.25, 523.25] : [523.25, 659.25, 783.99];

      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, now + idx * 0.14);

        gain.gain.setValueAtTime(0.12, now + idx * 0.14);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.14 + 0.25);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now + idx * 0.14);
        osc.stop(now + idx * 0.14 + 0.26);
      });
    }

    function render() {
      const m = String(Math.floor(sec / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      timeEl.textContent = `${m}:${s}`;
      statusLabel.textContent = mode === "focus" ? "集中モード" : "休憩モード";
      focusInput.value = focusSec;
      breakInput.value = breakSec;
      soundBtn.textContent = soundOn ? "音: ON" : "音: OFF";
      soundBtn.classList.toggle("active", soundOn);
      document.body.classList.toggle("running", running);
      focusTab.classList.toggle("active", mode === "focus");
      breakTab.classList.toggle("active", mode === "break");
      startBtn.style.display = running ? "none" : "inline-block";
      stopBtn.style.display = running ? "inline-block" : "none";
    }

    function applyCycle(newFocusSec, newBreakSec) {
      running = false;
      focusSec = Math.max(1, Number(newFocusSec) || 5);
      breakSec = Math.max(1, Number(newBreakSec) || 2);
      mode = "focus";
      sec = focusSec;
      if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
      render();
    }

    function switchMode(newMode) {
      running = false;
      mode = newMode;
      sec = mode === "focus" ? focusSec : breakSec;
      render();
    }

    soundBtn.onclick = () => {
      soundOn = !soundOn;
      if (soundOn) {
        initAudio();
        playSound("breakEnd");
      }
      render();
    };

    focusTab.onclick = () => switchMode("focus");
    breakTab.onclick = () => switchMode("break");

    demoPresetBtn.onclick = () => applyCycle(5, 2);
    normalPresetBtn.onclick = () => applyCycle(25 * 60, 5 * 60);

    setBtn.onclick = () => applyCycle(focusInput.value, breakInput.value);

    startBtn.onclick = () => {
      initAudio();
      running = true;
      document.documentElement.requestFullscreen?.().catch(() => {});
      render();
    };

    stopBtn.onclick = () => {
      running = false;
      if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
      render();
    };

    resetBtn.onclick = () => {
      running = false;
      sec = mode === "focus" ? focusSec : breakSec;
      if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
      render();
    };

    setInterval(() => {
      if (!running) return;
      if (sec > 1) {
        sec--;
        render();
      } else {
        if (mode === "focus") {
          playSound("focusEnd");
          mode = "break";
          sec = breakSec;
        } else {
          playSound("breakEnd");
          mode = "focus";
          sec = focusSec;
        }
        render();
      }
    }, 1000);

    render();
  </script>
</body>
</html>
